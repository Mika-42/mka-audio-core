name: Windows C++26 checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-mingw15:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cmake>=4.0,<5' ninja
      - name: Install pinned MinGW-w64 GCC 15.2 (POSIX, UCRT)
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mingw15.7z'
          $toolchain = Join-Path $env:RUNNER_TEMP 'mingw15'
          Invoke-WebRequest -Uri 'https://github.com/brechtsanders/winlibs_mingw/releases/download/15.2.0posix-14.0.0-ucrt-r7/winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.7z' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'a914feafd7462126637d4b8196a31f3fb856ad929768ceb092c99969b43675b3') {
            throw 'Unexpected MinGW toolchain checksum'
          }
          & "$env:ProgramFiles\7-Zip\7z.exe" x $archive "-o$toolchain" -y
          if ($LASTEXITCODE -ne 0) { throw 'MinGW toolchain extraction failed' }
          "$toolchain\mingw64\bin" >> $env:GITHUB_PATH
      - name: Verify the compiler used for the regression
        shell: pwsh
        run: |
          if ((g++ -dumpfullversion) -ne '15.2.0') { throw 'GCC 15.2.0 is required' }
          if ((g++ -dumpmachine) -ne 'x86_64-w64-mingw32') { throw 'A Windows MinGW target is required' }
          g++ --version
      - run: python ci/fetch_asio_sdk.py --destination build/asio-sdk
      - run: cmake --preset core -B build/windows-mingw15 -DCMAKE_CXX_COMPILER=g++ -DMKA_BUILD_WASAPI=ON -DMKA_BUILD_ASIO_SDK_TESTS=ON -DMKA_ASIO_SDK_DIR="$PWD/build/asio-sdk/ASIOSDK"
      - run: cmake --build build/windows-mingw15 --parallel 2
      - run: ctest --test-dir build/windows-mingw15 -L unit --no-tests=error --output-on-failure --parallel 2 --output-junit "$PWD/junit-windows-mingw15.xml"
      - name: Configure optimized MinGW module consumer
        run: cmake --preset core -B build/windows-mingw15-release -DCMAKE_CXX_COMPILER=g++ -DMKA_BUILD_WASAPI=ON -DCMAKE_BUILD_TYPE=Release -DMKA_BUILD_ASIO_SDK_TESTS=ON -DMKA_ASIO_SDK_DIR="$PWD/build/asio-sdk/ASIOSDK"
      - run: cmake --build build/windows-mingw15-release --parallel 2
      - run: ctest --test-dir build/windows-mingw15-release -L unit --no-tests=error --output-on-failure --parallel 2 --output-junit "$PWD/junit-windows-mingw15-release.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-mingw15-tests
          path: |
            junit-windows-mingw15.xml
            junit-windows-mingw15-release.xml
            build/windows-mingw15/Testing/Temporary/LastTest.log
            build/windows-mingw15-release/Testing/Temporary/LastTest.log

  windows-core:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install build tools
        run: python -m pip install 'cmake>=4.0,<5' ninja
      - run: python ci/fetch_asio_sdk.py --destination build/asio-sdk
      - run: cmake --preset windows-core -DMKA_BUILD_ASIO_SDK_TESTS=ON -DMKA_ASIO_SDK_DIR="$PWD/build/asio-sdk/ASIOSDK"
      - run: cmake --build --preset windows-core --parallel 2
      - run: ctest --preset windows-core --output-junit "${{ github.workspace }}/junit-windows-core.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-core-tests
          path: |
            junit-windows-core.xml
            build/windows-core/Testing/Temporary/LastTest.log

  windows-wasapi:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: python -m pip install 'cmake>=4.0,<5' ninja
      - run: cmake --preset windows-wasapi
      - run: cmake --build --preset windows-wasapi --parallel 2
      - name: Verify audible tests are compiled, discoverable and opt-in
        run: python ci/check_wasapi_manual_tests.py build/windows-wasapi
      - run: ctest --preset windows-wasapi --output-junit "${{ github.workspace }}/junit-wasapi.xml"
      - name: Hardware integration or explicit unavailable-device skips
        run: ctest --test-dir build/windows-wasapi -L hardware --no-tests=error --output-on-failure --output-junit "${{ github.workspace }}/junit-wasapi-hardware.xml"
      - name: Build the production library without test hooks or GoogleTest
        run: |
          cmake --preset windows-wasapi -B build/windows-production -DMKA_BUILD_TESTS=OFF
          cmake --build build/windows-production --parallel 2
          python -c "import json; from pathlib import Path; c=json.loads(Path('build/windows-production/compile_commands.json').read_text()); assert all('MKA_WASAPI_TESTING' not in x['command'] and 'googletest' not in x['file'] for x in c)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-wasapi-tests
          path: |
            junit-wasapi*.xml
            build/windows-wasapi/Testing/Temporary/LastTest.log

  windows-asan:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: python -m pip install 'cmake>=4.0,<5' ninja
      - run: cmake --preset windows-wasapi-asan
      - run: cmake --build --preset windows-wasapi-asan --parallel 2
      - name: Verify instrumentation and an isolated negative runtime witness
        run: ./ci/verify_msvc_asan.ps1
      - run: ctest --preset windows-wasapi-asan --output-junit "${{ github.workspace }}/junit-wasapi-asan.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-wasapi-asan
          path: |
            junit-wasapi-asan.xml
            build/windows-wasapi-asan/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/mka-asan-witness.log
