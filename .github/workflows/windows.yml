name: Windows C++26 checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-core:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install build tools
        run: python -m pip install 'cmake>=4.0,<5' ninja
      - run: cmake --preset windows-core
      - run: cmake --build --preset windows-core --parallel 2
      - run: ctest --preset windows-core --output-junit "${{ github.workspace }}/junit-windows-core.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-core-tests
          path: |
            junit-windows-core.xml
            build/windows-core/Testing/Temporary/LastTest.log
