name: Portable modules and package
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        if: runner.os == 'Linux'
        with:
          native: 'true'
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Configure Linux compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo 'CXX=clang++-19' >> "$GITHUB_ENV"
          echo 'CXXFLAGS=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14' >> "$GITHUB_ENV"
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        run: python -m pip install 'cmake>=4.0,<5' ninja
      - name: Install macOS compiler and module scanner
        if: runner.os == 'macOS'
        run: |
          brew install llvm ninja cmake
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"
      - run: python ci/check_client.py --work build/client-core --core-only
      - run: python ci/check_client.py --work build/client-native -- -DMKA_BUILD_DIAGNOSTICS=ON -DMKA_BUILD_EXAMPLES=ON
      - run: python ci/check_install.py --work build/package-core --core-only
      - run: python ci/check_install.py --work build/package-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-${{ matrix.os }}
          path: |
            build/client-*/client-results.xml
            build/package-*/installed-client-results.xml

  configuration-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CXX: clang++-19
      CXXFLAGS: --gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - run: cmake --preset asan -B build/fuzz -DMKA_BUILD_TESTS=OFF -DMKA_BUILD_FUZZERS=ON
      - run: cmake --build build/fuzz --parallel 2
      - run: python3 ci/run_config_fuzz.py --binary build/fuzz/mka-audio-config-fuzz --work build/fuzz/corpus --runs 100000
      - run: python3 ci/run_format_fuzz.py --binary build/fuzz/mka-audio-format-fuzz --work build/fuzz/format-corpus --runs 100000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: configuration-fuzz-reproducer
          path: |
            build/fuzz/corpus/
            build/fuzz/format-corpus/
