name: C++26 checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CXX: clang++-19
  CXXFLAGS: --gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - name: Configure core without audio SDKs
        run: cmake --preset core
      - name: Build C++26
        run: cmake --build --preset core --parallel 2
      - name: Execute unit tests
        run: ctest --preset core --output-junit "${{ github.workspace }}/junit-core.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results
          path: |
            junit-core.xml
            build/core/Testing/Temporary/LastTest.log

  options:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: python3 ci/linux_matrix.py --github-output >> "$GITHUB_OUTPUT"
  linux-options:
    needs: options
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.options.outputs.matrix) }}
    env:
      MKA_ALSA: ${{ matrix.alsa }}
      MKA_JACK: ${{ matrix.jack }}
      MKA_PIPEWIRE: ${{ matrix.pipewire }}
      MKA_PULSEAUDIO: ${{ matrix.pulseaudio }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          native: 'true'
      - name: Configure backend switches
        run: >-
          cmake --preset core -B build/linux
          -DMKA_BUILD_ALSA="$MKA_ALSA" -DMKA_BUILD_JACK="$MKA_JACK"
          -DMKA_BUILD_PIPEWIRE="$MKA_PIPEWIRE" -DMKA_BUILD_PULSEAUDIO="$MKA_PULSEAUDIO"
      - run: cmake --build build/linux --parallel 2
      - name: Unit tests
        run: ctest --test-dir build/linux -L unit --no-tests=error --output-on-failure --output-junit "${{ github.workspace }}/junit-unit.xml"
      - name: Native tests on private virtual servers
        if: matrix.native
        run: bash test/linux/run_virtual_tests.sh ctest --test-dir build/linux -L integration -LE hardware --no-tests=error --output-on-failure --output-junit "${{ github.workspace }}/junit-native.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.name }}
          path: |
            junit-*.xml
            build/linux/Testing/Temporary/LastTest.log

  asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - run: cmake --preset asan
      - run: cmake --build --preset asan --parallel 2
      - run: ctest --preset asan --output-junit "${{ github.workspace }}/junit-asan.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asan-test-results
          path: |
            junit-asan.xml
            build/asan/Testing/Temporary/LastTest.log
