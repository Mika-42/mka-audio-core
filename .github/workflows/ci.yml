name: C++26 checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CXX: clang++-19
  CXXFLAGS: --gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14
jobs:
  gcc16-core:
    runs-on: ubuntu-24.04
    # Reproduce GCC/libstdc++ 16 module/header declaration merging.
    container: gcc:16@sha256:302a3abf0811355429805247a2ef01ac830866750d550ac0c923255c05a25004
    timeout-minutes: 15
    env:
      CXX: g++
      CXXFLAGS: ''
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake and Ninja
        run: |
          apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends python3-venv
          python3 -m venv /tmp/mka-gcc16-tools
          /tmp/mka-gcc16-tools/bin/python -m pip install 'cmake>=4.0,<5' ninja
          echo /tmp/mka-gcc16-tools/bin >> "$GITHUB_PATH"
      - run: g++ --version
      - run: cmake --preset core
      - run: cmake --build --preset core --parallel 2
      - run: ctest --preset core --output-junit "$PWD/junit-gcc16.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gcc16-core-test-results
          path: |
            junit-gcc16.xml
            build/core/Testing/Temporary/LastTest.log

  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - name: Configure core without audio SDKs
        run: cmake --preset core
      - run: python3 ci/check_directsound_platform.py
      - run: python3 ci/check_directsound_build.py build/core --disabled
      - name: Build C++26
        run: cmake --build --preset core --parallel 2
      - name: Execute unit tests
        run: ctest --preset core --output-junit "${{ github.workspace }}/junit-core.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results
          path: |
            junit-core.xml
            build/core/Testing/Temporary/LastTest.log

  options:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: python3 ci/linux_matrix.py --github-output >> "$GITHUB_OUTPUT"
  linux-options:
    needs: options
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.options.outputs.matrix) }}
    env:
      MKA_ALSA: ${{ matrix.alsa }}
      MKA_JACK: ${{ matrix.jack }}
      MKA_PIPEWIRE: ${{ matrix.pipewire }}
      MKA_PULSEAUDIO: ${{ matrix.pulseaudio }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          native: 'true'
      - name: Configure backend switches
        run: >-
          cmake --preset core -B build/linux
          -DMKA_BUILD_ALSA="$MKA_ALSA" -DMKA_BUILD_JACK="$MKA_JACK"
          -DMKA_BUILD_PIPEWIRE="$MKA_PIPEWIRE" -DMKA_BUILD_PULSEAUDIO="$MKA_PULSEAUDIO"
      - run: cmake --build build/linux --parallel 2
      - name: Unit tests
        run: ctest --test-dir build/linux -L unit --no-tests=error --output-on-failure --output-junit "${{ github.workspace }}/junit-unit.xml"
      - name: Native tests on private virtual servers
        if: matrix.native
        run: bash test/linux/run_virtual_tests.sh ctest --test-dir build/linux -L integration -LE hardware --no-tests=error --output-on-failure --output-junit "${{ github.workspace }}/junit-native.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.name }}
          path: |
            junit-*.xml
            build/linux/Testing/Temporary/LastTest.log

  asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - run: cmake --preset asan
      - run: cmake --build --preset asan --parallel 2
      - run: ctest --preset asan --output-junit "${{ github.workspace }}/junit-asan.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asan-test-results
          path: |
            junit-asan.xml
            build/asan/Testing/Temporary/LastTest.log

  tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - run: cmake --preset tsan
      - run: cmake --build --preset tsan --parallel 2
      - run: ctest --preset tsan --output-junit "${{ github.workspace }}/junit-tsan.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tsan-test-results
          path: |
            junit-tsan.xml
            build/tsan/Testing/Temporary/LastTest.log

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - run: cmake --preset coverage
      - name: Build, test and report core coverage
        run: cmake --build --preset coverage --parallel 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-coverage
          path: |
            build/coverage/coverage/
            build/coverage/Testing/Temporary/LastTest.log
