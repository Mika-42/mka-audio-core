name: C++26 build tools
description: Install Clang 19, libstdc++ 14, CMake 4 and Ninja.
inputs:
  native:
    description: Install Linux audio SDKs and virtual server tools.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install compiler and standard library
      shell: bash
      run: |
        # The Azure HTTP mirror stalled repeatedly during previous matrix runs.
        # Keep Ubuntu's signed repository metadata and use the official HTTPS mirror.
        if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
        fi
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends clang-19 clang-tools-19 libclang-rt-19-dev llvm-19 g++-14
        python -m pip install 'cmake>=4.0,<5' ninja
    - name: Install Linux audio SDKs and virtual servers
      if: inputs.native == 'true'
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends dbus-daemon libasound2-dev libjack-jackd2-dev libpipewire-0.3-dev libpulse-dev jackd2 pipewire-bin wireplumber pulseaudio pulseaudio-utils
